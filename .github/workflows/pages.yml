name: Deploy Puzzle Rivals website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Verify website and Unity WebGL build
        shell: bash
        run: |
          test -f index.html
          test -f style.css
          test -f CNAME
          test -f game/index.html
          test -f game/Build/PuzzleRivals-WebGL.loader.js
          test -f game/Build/PuzzleRivals-WebGL.wasm.gz
          test -f game/Build/PuzzleRivals-WebGL.data.gz
          test -f game/Build/PuzzleRivals-WebGL.framework.js

      - name: Verify gzip assets and reject obsolete Tesana endpoint
        shell: bash
        run: |
          gzip -t game/Build/PuzzleRivals-WebGL.data.gz game/Build/PuzzleRivals-WebGL.wasm.gz
          grep -q "new DecompressionStream('gzip')" game/index.html
          grep -q "application/wasm" game/index.html
          grep -q 'PuzzleRivals-WebGL.data.gz' game/index.html
          grep -q 'PuzzleRivals-WebGL.wasm.gz' game/index.html
          if gzip -cd game/Build/PuzzleRivals-WebGL.data.gz game/Build/PuzzleRivals-WebGL.wasm.gz | grep -aiE 'mp\.tesana\.ai|tesana\.ai'; then
            echo "::error::Obsolete Tesana matchmaking endpoint found in compressed game payload."
            exit 1
          fi
          if grep -aiE 'mp\.tesana\.ai|tesana\.ai' game/Build/*.js game/index.html; then
            echo "::error::Obsolete Tesana matchmaking endpoint found in game loader or page."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
